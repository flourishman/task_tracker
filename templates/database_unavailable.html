<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10212a">
    <title>Planner temporarily offline</title>
    <style>
        :root { color-scheme: light dark; font-family: "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; color: #e4f4f5; background: radial-gradient(circle at 80% 10%, rgba(20,184,166,.15), transparent 28%), #08141b; }
        main { width: min(100%, 460px); padding: 34px; border: 1px solid rgba(148,181,190,.2); border-radius: 18px; background: #10212a; box-shadow: 0 24px 70px rgba(0,0,0,.3); }
        .signal { width: 46px; height: 46px; display: grid; place-items: center; margin-bottom: 22px; border: 1px solid rgba(251,191,36,.28); border-radius: 14px; color: #fbbf24; background: rgba(251,191,36,.1); font-size: 22px; }
        p.kicker { margin: 0 0 8px; color: #67d4c5; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
        h1 { margin: 0 0 12px; font-size: 25px; }
        p { margin: 0; color: #a8c0c7; font-size: 14px; line-height: 1.65; }
        .actions { display: flex; align-items: center; gap: 14px; margin-top: 24px; }
        .retry { display: inline-flex; flex: 0 0 auto; align-items: center; justify-content: center; min-height: 42px; padding: 0 16px; border-radius: 10px; color: white; background: linear-gradient(135deg, #087f8c, #2563eb); font-size: 13px; font-weight: 700; text-decoration: none; white-space: nowrap; }
        .note { color: #839da6; font-size: 12px; }
        @media (max-width: 480px) { main { padding: 26px 22px; } .actions { align-items: flex-start; flex-direction: column; } }
    </style>
</head>
<body>
    <main>
        <div class="signal" aria-hidden="true">!</div>
        <p class="kicker">Connection unavailable</p>
        <h1>Your planner is temporarily offline</h1>
        <p>The app can’t reach its database right now. Check your internet connection and try again. Your tasks remain in PostgreSQL and haven’t been moved or changed.</p>
        <div class="actions">
            <a class="retry" href="{{ request.url }}">Try again</a>
            <span class="note">This page will work again when the database is reachable.</span>
        </div>
    </main>
</body>
</html>
