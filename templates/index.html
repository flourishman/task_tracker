<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 480px;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            color: #0f172a;
        }

        .task-form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .btn-add {
            background-color: var(--primary);
            color: white;
        }

        .btn-add:hover {
            background-color: var(--primary-hover);
        }

        .btn-delete {
            background-color: transparent;
            color: var(--danger);
            border: 1px solid var(--border);
            padding: 6px 12px;
        }

        .btn-delete:hover {
            background-color: #fef2f2;
            border-color: var(--danger);
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 15px;
        }

        li:last-child {
            border-bottom: none;
        }

        .empty-state {
            text-align: center;
            color: #64748b;
            padding: 20px 0;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>My Personal Task Tracker</h1>
        
        <form action="/add" method="POST" class="task-form">
            <input type="text" name="task" placeholder="Enter a new task..." required>
            <button type="submit" class="btn-add">Add Task</button>
        </form>

        <ul>
            {% for task_id, title in tasks %}
                <li>
                    <span>{{ title }}</span>
                    <form action="/delete/{{ task_id }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn-delete">Delete</button>
                    </form>
                </li>
            {% else %}
                <li class="empty-state">No tasks added yet!</li>
            {% endfor %}
        </ul>
    </div>

</body>
</html>
