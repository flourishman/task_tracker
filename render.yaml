services:
  - type: web
    name: daily-task-planner
    runtime: python
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PASSWORD_RESET_CODE
        sync: false